appId: com.alexpo.grammermate
tags:
  - training
  - input-modes
---
# Test input mode switching in training
- launchApp
- tapOn: "Continue Learning"
- tapOn: "Start Lesson"

# Training screen renders
- assertVisible: "Check"

# Switch to keyboard mode
- tapOn:
    contentDescription: "Keyboard mode"
- assertVisible: "Your translation"

# Switch to word bank mode
- tapOn:
    contentDescription: "Word bank mode"
- assertVisible: "Undo"

# Switch back to voice mode
- tapOn:
    contentDescription: "Voice mode"
