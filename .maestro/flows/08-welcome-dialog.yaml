appId: com.alexpo.grammermate
tags:
  - onboarding
---
# First-launch welcome dialog flow
# Requires fresh install / cleared data
- launchApp

# Welcome dialog should appear on first launch
- assertVisible: "Welcome to GrammarMate"
- assertVisible: "What.*name"
- assertVisible: "Continue"
- assertVisible: "Skip"

# Enter name and continue
- tapOn: "Enter your name"
- inputText: "TestUser"
- tapOn: "Continue"

# Should land on home screen
- assertVisible: "Grammar Roadmap"
