tenses:
  - name: "Präsens"
    short: "Präs."
    formula: "Основа глагола + личные окончания: -e, -st, -t, -en, -t, -en. Слабые глаголы: mach-en → ich mache, du machst, er macht, wir machen, ihr macht, sie machen. Сильные глаголы имеют чередование гласных: fahren → er fährt, sehen → er sieht."
    usage_ru: "Текущие, регулярные и привычные действия, а также общие утверждения. Основное настоящее время, покрывает 'я делаю' и 'я делаю обычно'. Часто с immer, oft, jeden Tag, normalerweise."
    examples:
      - target: "Ich esse ein Brötchen."
        ru: "Я ем булочку."
        note: "Регулярное действие в настоящем"
      - target: "Er arbeitet in Berlin."
        ru: "Он работает в Берлине."
        note: "Постоянное состояние"
      - target: "Jeden Morgen trinke ich Kaffee."
        ru: "Каждое утро я пью кофе."
        note: "Привычное действие"

  - name: "Präteritum"
    short: "Prät."
    formula: "Слабые глаголы: основа + -te, -test, -te, -ten, -tet, -ten (machen → machte). Сильные глаголы: изменение гласного + окончания -∅, -st, -∅, -n, -t, -n (gehen → ging, sehen → sah). Sein → war, haben → hatte."
    usage_ru: "Простое прошедшее время. Основное время повествования в письменной речи. В разговорной речи используется редко (кроме sein, haben, модальных глаголов), уступая место Perfekt. Часто встречается в книгах, газетах, рассказах."
    examples:
      - target: "Ich ging nach Hause."
        ru: "Я пошёл домой."
        note: "Сильный глагол (gehen → ging)"
      - target: "Er machte die Tür auf."
        ru: "Он открыл дверь."
        note: "Слабый глагол (machen → machte)"
      - target: "Sie war müde."
        ru: "Она была уставшей."
        note: "Sein в Präteritum (war)"

  - name: "Perfekt"
    short: "Perf."
    formula: "haben/sein (в Präsens) + Partizip II. haben — для большинства глаголов. sein — для глаголов движения (gehen, kommen, fahren), изменения состояния (werden, aufwachen) и sein/bleiben. Partizip II слабых: ge- + основа + -t (gemacht). Сильных: ge- + основа (с чередованием) + -en (gegangen)."
    usage_ru: "Завершённые действия в прошлом. Основное прошедшее время в разговорной речи. Используется с gestern, letzte Woche, am Montag. С глаголами движения и изменения состояния используется sein вместо haben."
    examples:
      - target: "Ich habe eine Pizza gegessen."
        ru: "Я съел пиццу."
        note: "Завершённое действие, вспомогательный haben"
      - target: "Er ist nach Berlin gefahren."
        ru: "Он поехал в Берлин."
        note: "Глагол движения, вспомогательный sein"
      - target: "Gestern habe ich ein Buch gekauft."
        ru: "Вчера я купил книгу."
        note: "Точное время в прошлом"

  - name: "Plusquamperfekt"
    short: "Plusq."
    formula: "hatte/war (в Präteritum) + Partizip II. hatte — для большинства глаголов, war — для глаголов движения и изменения состояния. Согласование причастия не требуется."
    usage_ru: "Предпрошедшее время. Действие, завершённое до другого действия в прошлом. Часто используется с als, nachdem, bevor для хронологии событий. Аналог английского Past Perfect."
    examples:
      - target: "Ich hatte schon gegessen, als er kam."
        ru: "Я уже поел, когда он пришёл."
        note: "Предпрошедшее: поел раньше, чем пришёл"
      - target: "Sie war vor dem Regen abgefahren."
        ru: "Она уехала до дождя."
        note: "Действие, предшествующее другому"
      - target: "Er sagte, dass er fertig war."
        ru: "Он сказал, что закончил."
        note: "Косвенная речь"

  - name: "Futur I"
    short: "Fut. I"
    formula: "werden (в Präsens) + инфинитив в конце предложения: ich werde machen, du wirst machen, er wird machen, wir werden machen, ihr werdet machen, sie werden machen."
    usage_ru: "Действия в будущем. Также используется для предположений о настоящем ('наверное, он дома'), обещаний и намерений. С morgen, nächste Woche, in drei Tagen."
    examples:
      - target: "Morgen werde ich ans Meer fahren."
        ru: "Завтра я поеду на море."
        note: "Реальное будущее действие"
      - target: "Er wird jetzt zu Hause sein."
        ru: "Наверное, он сейчас дома."
        note: "Предположение о настоящем"
      - target: "Ich werde dir gerne helfen."
        ru: "Я охотно тебе помогу."
        note: "Обещание"

  - name: "Futur II"
    short: "Fut. II"
    formula: "werden (в Präsens) + Partizip II + haben/sein в инфинитиве в конце: ich werde gemacht haben, er wird gegangen sein."
    usage_ru: "Действие, которое завершится к определённому моменту в будущем ('предбудущее'). Часто с bis, wenn, bevor. Также для уверенных предположений о прошлом."
    examples:
      - target: "Bis morgen werde ich die Arbeit beendet haben."
        ru: "К завтрашнему дню я закончу работу."
        note: "Завершение к сроку в будущем"
      - target: "Wenn du ankommst, werde ich schon gekocht haben."
        ru: "Когда ты приедешь, я уже приготовлю."
        note: "Предшествование в будущем"
      - target: "Er wird den Termin vergessen haben."
        ru: "Наверное, он забыл о встрече."
        note: "Уверенное предположение о прошлом"

  - name: "Konjunktiv II (Gegenwart)"
    short: "Konj. II"
    formula: "Основа Präteritum + умлаут (если возможно) + окончания -e, -est, -e, -en, -et, -en. Часто заменяется формой würde + инфинитив: ich würde machen, du würdest machen. Модальные: könnte, müsste, dürfte, sollte, wollte."
    usage_ru: "Сослагательное наклонение для нереальных или гипотетических действий, вежливых просьб и желаний. 'Я бы сделал', 'Не могли бы вы...'. Также в условных предложениях с wenn ('если бы я знал...')."
    examples:
      - target: "Ich möchte einen Kaffee, bitte."
        ru: "Я хотел бы кофе, пожалуйста."
        note: "Вежливая просьба (möchte = Konjunktiv II от mögen)"
      - target: "Ich würde gern Pizza essen."
        ru: "Я бы охотно съел пиццу."
        note: "Желание (würde + инфинитив)"
      - target: "Wenn ich Zeit hätte, käme ich."
        ru: "Если бы у меня было время, я бы пришёл."
        note: "Условное предложение (wenn + Konjunktiv II)"

  - name: "Konjunktiv II (Vergangenheit)"
    short: "Konj. II V."
    formula: "hätte/wäre (Konjunktiv II) + Partizip II. hätte — для большинства глаголов, wäre — для глаголов движения и изменения состояния. Аналог: würde + Perfekt инфинитив (würde gemacht haben)."
    usage_ru: "Нереальные или гипотетические действия в прошлом. 'Я бы сделал, если бы...'. Используется с wenn + Plusquamperfekt для условных предложений. Сожаления о прошлом."
    examples:
      - target: "Ich hätte den Kuchen gegessen, aber ich war auf Diät."
        ru: "Я бы съел торт, но был на диете."
        note: "Нереализованное желание"
      - target: "Wenn ich Zeit gehabt hätte, wäre ich gekommen."
        ru: "Если бы у меня было время, я бы пришёл."
        note: "Условное предложение (wenn + Plusquamperfekt)"
      - target: "Ich hätte mehr lernen sollen."
        ru: "Мне следовало бы учиться больше."
        note: "Сожаление о прошлом"

  - name: "Imperativ"
    short: "Imp."
    formula: "Du-форма: основа (+ -e): Mach! / Mach die Tür auf! Ihr-форма: основа + -t: Macht! / Macht die Tür auf! Sie-форма: инфинитив + Sie: Machen Sie! Wir-форма: инфинитив + wir: Machen wir! Нерегулярные: sein → sei, haben → habe."
    usage_ru: "Повелительное наклонение. Приказы, просьбы, советы и приглашения. Форма зависит от обращения: du (неформальное, единственное), ihr (неформальное, множественное), Sie (вежливое). Часто используется с bitte для смягчения."
    examples:
      - target: "Mach die Tür zu!"
        ru: "Закрой дверь!"
        note: "Приказ (du-форма)"
      - target: "Sprechen Sie bitte langsamer."
        ru: "Говорите, пожалуйста, медленнее."
        note: "Вежливая просьба (Sie-форма)"
      - target: "Gehen wir!"
        ru: "Пойдём!"
        note: "Призыв к действию (wir-форма)"

  - name: "Passiv (Präsens)"
    short: "Pass. Präs."
    formula: "werden (в Präsens) + Partizip II: ich werde gemacht, du wirst gemacht, er wird gemacht, wir werden gemacht, ihr werdet gemacht, sie werden gemacht. Действующее лицо: von + Dativ."
    usage_ru: "Пассив настоящего времени. Действие совершается над подлежащим, а не подлежащим. Фокус на действии или результате, а не на том, кто выполняет действие. Часто в технических текстах, новостях, инструкциях."
    examples:
      - target: "Das Haus wird gebaut."
        ru: "Дом строится."
        note: "Действие в пассиве"
      - target: "Der Brief wird von Maria geschrieben."
        ru: "Письмо пишется Марией."
        note: "Пассив с указанием действующего лица (von + Dativ)"
      - target: "Deutsch wird in vielen Ländern gesprochen."
        ru: "Немецкий говорят во многих странах."
        note: "Общее утверждение в пассиве"
