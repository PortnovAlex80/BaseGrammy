# Clean Gradle configuration for stability
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Ограничение worker'ов: параллельные test-JVM (:domain + :app) вместе вызывают
# native JVM OOM на dev-машинах (hs_err: 106 threads, недостаток native memory).
# Фаза 0 плана стабилизации REFACTORING_PLAN_2026-08-26.md.
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.overridePathCheck=true
