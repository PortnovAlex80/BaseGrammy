name: CI

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build production and preview APKs
        run: ./gradlew :app:assembleLegacyDebug :app:assembleV2Debug

      - name: Run unit tests
        # GitHub-runner'ы (7 ГБ RAM) переживают 2 воркера; на dev-машинах
        # параллельные test-JVM :domain+:app дают native OOM — локально
        # запускать с --max-workers=1 (см. java.txt, план Фаза 0).
        run: ./gradlew :domain:test :app:testV2DebugUnitTest --max-workers=2

      - name: Audit restored product regressions
        # Temporary non-blocking audit: the preserved suite currently has known
        # stale/broken tests tracked in migration-parity-audit.md. Its result is
        # always uploaded and must reach zero failures before v2 can replace legacy.
        continue-on-error: true
        run: ./gradlew :app:testLegacyDebugUnitTest --max-workers=1 --no-parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            domain/build/reports/tests/

  instrumentation:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedLegacyDebugAndroidTest :app:connectedV2DebugAndroidTest --max-workers=1

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results
          path: app/build/reports/androidTests/
